name: Build BotPvP Jar

# Trigger: setiap push ke branch manapun, setiap pull request, dan bisa dijalankan manual
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build (Minecraft ${{ matrix.minecraft_version }})
    runs-on: ubuntu-latest

    # Build dua kali secara paralel: sekali untuk 26.1.1, sekali untuk 26.1.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft_version: "26.1.1"
            fabric_version: "0.148.0+26.1.2"   # fabric-api versi ini mendukung 26.1.1 juga
          - minecraft_version: "26.1.2"
            fabric_version: "0.148.0+26.1.2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          # gradlew bawaan project ini cuma memanggil 'gradle' sistem,
          # jadi kita pakai gradle/gradle-build-action yang menyediakan gradle wrapper standar.
          chmod +x ./gradlew || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Override minecraft_version in gradle.properties
        run: |
          sed -i "s/^minecraft_version=.*/minecraft_version=${{ matrix.minecraft_version }}/" gradle.properties
          sed -i "s/^fabric_version=.*/fabric_version=${{ matrix.fabric_version }}/" gradle.properties
          echo "----- gradle.properties -----"
          cat gradle.properties

      - name: Build mod jar
        run: gradle build -x test --stacktrace

      - name: List build output
        run: find build/libs -type f -name "*.jar"

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: botpvp-mc${{ matrix.minecraft_version }}
          path: build/libs/*.jar
          if-no-files-found: error
